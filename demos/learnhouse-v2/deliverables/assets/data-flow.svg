<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#41789d"/></marker></defs><rect width="960" height="960" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif"><text x="480" y="42" font-size="30" fill="#173f60" text-anchor="middle">数据主链与职责边界</text><text x="480" y="78" font-size="22" fill="#173f60" text-anchor="middle">通用 LMS 身份复用；学习事实由 ea 扩展保存</text><rect x="40" y="105" width="880" height="90" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="480.0" y="142.0" font-size="23" fill="#173f60" text-anchor="middle">LearnHouse：组织、账号、课程、活动、班级、作业身份</text><text x="480.0" y="174.0" font-size="23" fill="#173f60" text-anchor="middle">public.* 是通用身份的唯一来源</text><rect x="40" y="240" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="165.0" y="271.0" font-size="23" fill="#173f60" text-anchor="middle">内容与版本</text><text x="165.0" y="303.0" font-size="23" fill="#173f60" text-anchor="middle">resource / version</text><text x="165.0" y="335.0" font-size="23" fill="#173f60" text-anchor="middle">量规、检查、发布</text><rect x="355" y="240" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="480.0" y="271.0" font-size="23" fill="#173f60" text-anchor="middle">一次布置</text><text x="480.0" y="303.0" font-size="23" fill="#173f60" text-anchor="middle">assignment_binding</text><text x="480.0" y="335.0" font-size="23" fill="#173f60" text-anchor="middle">接收人和规则冻结</text><rect x="670" y="240" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="795.0" y="271.0" font-size="23" fill="#173f60" text-anchor="middle">尝试与提交</text><text x="795.0" y="303.0" font-size="23" fill="#173f60" text-anchor="middle">attempt / submission</text><text x="795.0" y="335.0" font-size="23" fill="#173f60" text-anchor="middle">提交后不可覆盖</text><path d="M480 195 L480 230" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M290 295 L345 295" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M605 295 L660 295" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="670" y="405" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="795.0" y="436.0" font-size="23" fill="#173f60" text-anchor="middle">评估与生效成绩</text><text x="795.0" y="468.0" font-size="23" fill="#173f60" text-anchor="middle">evaluation</text><text x="795.0" y="500.0" font-size="23" fill="#173f60" text-anchor="middle">grade_revision</text><rect x="355" y="405" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="480.0" y="436.0" font-size="23" fill="#173f60" text-anchor="middle">证据事件</text><text x="480.0" y="468.0" font-size="23" fill="#173f60" text-anchor="middle">evidence_event</text><text x="480.0" y="500.0" font-size="23" fill="#173f60" text-anchor="middle">保留来源和授权</text><rect x="40" y="405" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="165.0" y="436.0" font-size="23" fill="#173f60" text-anchor="middle">学习状态版本</text><text x="165.0" y="468.0" font-size="23" fill="#173f60" text-anchor="middle">profile_version</text><text x="165.0" y="500.0" font-size="23" fill="#173f60" text-anchor="middle">规则统计 / 研究画像</text><path d="M795 350 L795 395" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M670 460 L615 460" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M355 460 L300 460" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="570" width="250" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="165.0" y="601.0" font-size="23" fill="#173f60" text-anchor="middle">个性化推荐</text><text x="165.0" y="633.0" font-size="23" fill="#173f60" text-anchor="middle">recommendation</text><text x="165.0" y="665.0" font-size="23" fill="#173f60" text-anchor="middle">点击时再次鉴权</text><rect x="355" y="570" width="565" height="110" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="637.5" y="601.0" font-size="23" fill="#173f60" text-anchor="middle">更正 / 撤权：新事件 → 新版本</text><text x="637.5" y="633.0" font-size="23" fill="#173f60" text-anchor="middle">历史保留；研究旧推断标为待重建</text><text x="637.5" y="665.0" font-size="23" fill="#173f60" text-anchor="middle">新成绩或撤权不改写既有模型事实</text><path d="M165 515 L165 560" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M637 570 L637 545" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><path d="M637 545 L480 525" stroke="#41789d" fill="none" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="735" width="880" height="90" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="480.0" y="772.0" font-size="23" fill="#173f60" text-anchor="middle">横向控制：principal / action_grant / policy_version</text><text x="480.0" y="804.0" font-size="23" fill="#173f60" text-anchor="middle">服务端对象鉴权；管理员没有默认教学正文权限</text><rect x="40" y="855" width="880" height="70" rx="12" fill="#eff5fa" stroke="#b6cbdc"/><text x="480.0" y="898.0" font-size="23" fill="#173f60" text-anchor="middle">可靠性：task_run / outbox_event / audit_event</text></g></svg>